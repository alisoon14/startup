<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Демо-режим - Map Тим</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 0;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
        }
        
        .logo-image {
            height: 40px;
            margin-right: 10px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #1e82ff, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            transition: color 0.3s;
            font-weight: 500;
        }
        
        .nav a:hover {
            color: #1e82ff;
        }
        
        .demo-container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section-title {
            font-size: 36px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #1e82ff, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        
        .section-subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #b0b0b0;
            font-size: 18px;
        }
        
        .map-container {
            height: 600px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        .demo-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #1e82ff, #006dff);
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(30, 130, 255, 0.3);
        }
        
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(30, 130, 255, 0.4);
        }
        
        .active-mode {
            background: linear-gradient(135deg, #ff6b35, #e55a2b);
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.3);
        }
        
        .active-mode:hover {
            box-shadow: 0 6px 15px rgba(255, 107, 53, 0.4);
        }
        
        .back-btn {
            background: linear-gradient(135deg, #555, #333);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .back-btn:hover {
            background: linear-gradient(135deg, #666, #444);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-left: 4px solid #1e82ff;
        }
        
        .tooltip.show {
            opacity: 1;
        }
        
        .mode-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 999;
            backdrop-filter: blur(5px);
            border-left: 4px solid #1e82ff;
        }
        
        .building-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 999;
            backdrop-filter: blur(5px);
            border-left: 4px solid #ff6b35;
            width: 250px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        
        .control-group input, .control-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: white;
        }
        
        .footer {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 25px 0;
            margin-top: 50px;
            backdrop-filter: blur(5px);
        }
        
        .footer p {
            margin: 5px 0;
        }
        
        .building-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 999;
            backdrop-filter: blur(5px);
            border-left: 4px solid #00c6ff;
        }
        
        .custom-building {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    
<header class="header">
    <div class="header-container">
        <a href="index.html" class="logo-link">
            <div class="logo-image" style="height: 40px; width: 40px; background: linear-gradient(135deg, #1e82ff, #00c6ff); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">M</div>
            <div class="logo-text">MAP TIM</div>
        </a>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="#contact">Контакты</a>
        </nav>
    </div>
</header>

<section class="demo-container">
    <h1 class="section-title">Демо-режим: Интерактивная 3D Карта</h1>
    <p class="section-subtitle">Используйте элементы управления для навигации по 3D карте и управления зданиями</p>
    
    <div class="demo-controls">
        <button class="control-btn" onclick="switchTo3D()">Включить 3D</button>
        <button class="control-btn" onclick="resetView()">Сбросить вид</button>
        <button class="control-btn" onclick="toggleBuildingSelection()" id="buildingSelectBtn">Выделение зданий</button>
        <button class="control-btn" onclick="toggleAreaSelection()" id="areaSelectBtn">Выделение территории</button>
        <button class="control-btn" onclick="generateBuildings()">Сгенерировать здания</button>
        <button class="control-btn back-btn" onclick="window.location.href='index.html'">← Назад</button>
    </div>
    
    <div class="map-container">
        <div id="map"></div>
        <div class="mode-indicator" id="modeIndicator">Режим: Навигация</div>
        <div class="building-info" id="buildingInfo">Зданий: 0</div>
        <div class="tooltip" id="tooltip"></div>
        
        <div class="building-controls">
            <h3 style="margin-bottom: 15px; color: #ff6b35;">Настройки зданий</h3>
            <div class="control-group">
                <label for="buildingType">Тип здания:</label>
                <select id="buildingType">
                    <option value="residential">Жилое</option>
                    <option value="commercial">Коммерческое</option>
                    <option value="industrial">Промышленное</option>
                    <option value="skyscraper">Небоскреб</option>
                </select>
            </div>
            <div class="control-group">
                <label for="buildingHeight">Высота (этажи):</label>
                <input type="range" id="buildingHeight" min="1" max="50" value="5">
                <span id="heightValue">5 этажей</span>
            </div>
            <div class="control-group">
                <label for="buildingColor">Цвет здания:</label>
                <input type="color" id="buildingColor" value="#1e82ff">
            </div>
            <button class="control-btn" onclick="applyBuildingSettings()" style="width: 100%; margin-top: 10px;">Применить к выделенным</button>
        </div>
    </div>
</section>

<footer class="footer" id="contact">
    <p>Email: info@maptim.example</p>
    <p>Телефон: +7 (999) 123-45-67</p>
    <p>© 2025 MAP TIM. Все права защищены.</p>
</footer>

<script>
    let map;
    let buildingCollection = [];
    let selectedBuildings = [];
    let drawingManager;
    let selectedArea = null;
    let isBuildingSelectionMode = false;
    let isAreaSelectionMode = false;
    let rectangle = null;

    // Инициализация карты
    function initMap() {
        map = new google.maps.Map(document.getElementById('map'), {
            center: { lat: 55.751244, lng: 37.618423 }, // Москва
            zoom: 11,
            mapTypeId: 'hybrid',
            tilt: 45, // Наклон для 3D эффекта
            heading: 0,
            styles: [
                {
                    "featureType": "all",
                    "elementType": "geometry.fill",
                    "stylers": [{"weight": "2.00"}]
                },
                {
                    "featureType": "all",
                    "elementType": "geometry.stroke",
                    "stylers": [{"color": "#9c9c9c"}]
                },
                {
                    "featureType": "all",
                    "elementType": "labels.text.fill",
                    "stylers": [{"gamma": 0.01}, {"lightness": 20}]
                },
                {
                    "featureType": "all",
                    "elementType": "labels.text.stroke",
                    "stylers": [{"saturation": -31}, {"lightness": -33}, {"weight": "2.00"}, {"gamma": 0.8}]
                }
            ]
        });

        // Включаем 3D здания
        map.setOptions({
            mapTypeControl: false,
            streetViewControl: false,
            fullscreenControl: true,
            zoomControl: true
        });

        // Инициализируем Drawing Manager для выделения областей
        drawingManager = new google.maps.drawing.DrawingManager({
            drawingMode: null,
            drawingControl: false,
            markerOptions: {
                draggable: false
            },
            polygonOptions: {
                fillColor: '#00c6ff33',
                strokeColor: '#00c6ff',
                strokeWeight: 2,
                editable: false
            },
            rectangleOptions: {
                fillColor: '#1e82ff33',
                strokeColor: '#1e82ff',
                strokeWeight: 2,
                editable: false
            }
        });

        drawingManager.setMap(map);

        // Добавляем обработчики для рисования
        google.maps.event.addListener(drawingManager, 'rectanglecomplete', function(rect) {
            if (isBuildingSelectionMode) {
                selectBuildingsInRectangle(rect);
                rectangle = rect;
            }
        });

        google.maps.event.addListener(drawingManager, 'polygoncomplete', function(polygon) {
            if (isAreaSelectionMode) {
                selectedArea = polygon;
                showTooltip('Территория выделена. Теперь можно генерировать здания внутри нее.', polygon.getPath().getAt(0));
            }
        });

        // Добавляем демо-здания
        addDemoBuildings();
        
        // Настраиваем слайдер высоты
        const heightSlider = document.getElementById('buildingHeight');
        const heightValue = document.getElementById('heightValue');
        heightSlider.addEventListener('input', function() {
            heightValue.textContent = this.value + ' этажей';
        });

        // Настраиваем подсказки
        setupTooltips();
    }

    // Создание 3D здания с использованием расширенных маркеров
    function create3DBuilding(position, type, height, color) {
        // Создаем кастомный маркер с 3D эффектом
        const buildingElement = document.createElement('div');
        buildingElement.className = 'custom-building';
        buildingElement.style.cssText = `
            width: ${30 + Math.random() * 20}px;
            height: ${height * 3}px;
            background: ${color};
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            position: relative;
            transform: perspective(500px) rotateX(45deg);
            transition: all 0.3s ease;
        `;

        // Добавляем окна
        for (let i = 0; i < height; i++) {
            const windowRow = document.createElement('div');
            windowRow.style.cssText = `
                width: 100%;
                height: 2px;
                background: linear-gradient(90deg, 
                    transparent 10%, 
                    rgba(255,255,255,0.7) 10%, 
                    rgba(255,255,255,0.7) 30%, 
                    transparent 30%, 
                    transparent 50%, 
                    rgba(255,255,255,0.7) 50%, 
                    rgba(255,255,255,0.7) 70%, 
                    transparent 70%, 
                    transparent 90%, 
                    rgba(255,255,255,0.7) 90%, 
                    rgba(255,255,255,0.7) 100%
                );
                position: absolute;
                top: ${i * 3}px;
                left: 0;
            `;
            buildingElement.appendChild(windowRow);
        }

        const building = new google.maps.marker.AdvancedMarkerElement({
            position: position,
            map: map,
            content: buildingElement,
            title: `${type === 'residential' ? 'Жилое' : type === 'commercial' ? 'Коммерческое' : type === 'industrial' ? 'Промышленное' : 'Небоскреб'} здание (${height} этажей)`
        });

        const buildingData = {
            marker: building,
            position: position,
            type: type,
            height: height,
            color: color,
            element: buildingElement,
            isSelected: false
        };

        buildingCollection.push(buildingData);

        // Добавляем обработчик клика для выделения
        building.addListener('click', function() {
            if (isBuildingSelectionMode) {
                toggleBuildingSelection(buildingData);
            }
        });

        updateBuildingInfo();
        return buildingData;
    }

    // Переключение выделения здания
    function toggleBuildingSelection(building) {
        if (building.isSelected) {
            building.element.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
            building.isSelected = false;
            selectedBuildings = selectedBuildings.filter(b => b !== building);
        } else {
            building.element.style.boxShadow = '0 0 20px #ff6b35, 0 0 30px #ff6b35';
            building.isSelected = true;
            selectedBuildings.push(building);
        }
        updateBuildingInfo();
    }

    // Выделение зданий в прямоугольнике
    function selectBuildingsInRectangle(rect) {
        clearBuildingSelection();
        
        const bounds = rect.getBounds();
        buildingCollection.forEach(building => {
            if (bounds.contains(building.position)) {
                toggleBuildingSelection(building);
            }
        });
        
        showTooltip(`Выделено зданий: ${selectedBuildings.length}`, rect.getBounds().getCenter());
    }

    // Очистка выделения зданий
    function clearBuildingSelection() {
        selectedBuildings.forEach(building => {
            building.element.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
            building.isSelected = false;
        });
        selectedBuildings = [];
        updateBuildingInfo();
    }

    // Переключение режима выделения зданий
    function toggleBuildingSelectionMode() {
        isBuildingSelectionMode = !isBuildingSelectionMode;
        isAreaSelectionMode = false;
        
        const btn = document.getElementById('buildingSelectBtn');
        const areaBtn = document.getElementById('areaSelectBtn');
        const indicator = document.getElementById('modeIndicator');
        
        if (isBuildingSelectionMode) {
            btn.classList.add('active-mode');
            areaBtn.classList.remove('active-mode');
            indicator.textContent = 'Режим: Выделение зданий';
            drawingManager.setDrawingMode(google.maps.drawing.OverlayType.RECTANGLE);
            
            // Очищаем выделение территории
            if (selectedArea) {
                selectedArea.setMap(null);
                selectedArea = null;
            }
        } else {
            btn.classList.remove('active-mode');
            indicator.textContent = 'Режим: Навигация';
            drawingManager.setDrawingMode(null);
            
            // Очищаем выделение зданий
            if (rectangle) {
                rectangle.setMap(null);
                rectangle = null;
            }
            clearBuildingSelection();
        }
    }

    // Переключение режима выделения территории
    function toggleAreaSelectionMode() {
        isAreaSelectionMode = !isAreaSelectionMode;
        isBuildingSelectionMode = false;
        
        const btn = document.getElementById('areaSelectBtn');
        const buildingBtn = document.getElementById('buildingSelectBtn');
        const indicator = document.getElementById('modeIndicator');
        
        if (isAreaSelectionMode) {
            btn.classList.add('active-mode');
            buildingBtn.classList.remove('active-mode');
            indicator.textContent = 'Режим: Выделение территории';
            drawingManager.setDrawingMode(google.maps.drawing.OverlayType.POLYGON);
            
            // Очищаем выделение зданий
            if (rectangle) {
                rectangle.setMap(null);
                rectangle = null;
            }
            clearBuildingSelection();
        } else {
            btn.classList.remove('active-mode');
            indicator.textContent = 'Режим: Навигация';
            drawingManager.setDrawingMode(null);
            
            // Очищаем выделение территории
            if (selectedArea) {
                selectedArea.setMap(null);
                selectedArea = null;
            }
        }
    }

    // Генерация зданий
    function generateBuildings() {
        let bounds;
        
        if (selectedArea) {
            const polygonBounds = new google.maps.LatLngBounds();
            selectedArea.getPath().forEach(latLng => {
                polygonBounds.extend(latLng);
            });
            bounds = polygonBounds;
        } else {
            bounds = map.getBounds();
        }
        
        const count = 8;
        
        for (let i = 0; i < count; i++) {
            const lat = bounds.getSouth() + Math.random() * (bounds.getNorth() - bounds.getSouth());
            const lng = bounds.getWest() + Math.random() * (bounds.getEast() - bounds.getWest());
            
            const height = Math.floor(Math.random() * 20) + 5;
            const type = ['residential', 'commercial', 'industrial', 'skyscraper'][Math.floor(Math.random() * 4)];
            const color = type === 'residential' ? '#1e82ff' : 
                         type === 'commercial' ? '#ff6b35' : 
                         type === 'industrial' ? '#00c6ff' : '#0047ab';
            
            create3DBuilding({ lat: lat, lng: lng }, type, height, color);
        }
        
        showTooltip(`Сгенерировано ${count} зданий`, map.getCenter());
    }

    // Применение настроек к выделенным зданиям
    function applyBuildingSettings() {
        if (selectedBuildings.length === 0) {
            showTooltip('Сначала выделите здания', map.getCenter());
            return;
        }
        
        const type = document.getElementById('buildingType').value;
        const height = parseInt(document.getElementById('buildingHeight').value);
        const color = document.getElementById('buildingColor').value;
        
        selectedBuildings.forEach(building => {
            // Удаляем старое здание
            building.marker.map = null;
            
            // Создаем новое с обновленными параметрами
            const newBuilding = create3DBuilding(building.position, type, height, color);
            
            // Обновляем ссылку в коллекции
            const index = buildingCollection.indexOf(building);
            if (index !== -1) {
                buildingCollection[index] = newBuilding;
            }
        });
        
        selectedBuildings = [];
        updateBuildingInfo();
        showTooltip(`Настройки применены к ${selectedBuildings.length} зданиям`, map.getCenter());
    }

    // Обновление информации о зданиях
    function updateBuildingInfo() {
        const buildingInfo = document.getElementById('buildingInfo');
        const totalBuildings = buildingCollection.length;
        const selectedCount = selectedBuildings.length;
        
        buildingInfo.textContent = `Зданий: ${totalBuildings}${selectedCount > 0 ? ` (выделено: ${selectedCount})` : ''}`;
    }

    // Показать подсказку
    function showTooltip(text, position) {
        const tooltip = document.getElementById('tooltip');
        tooltip.textContent = text;
        tooltip.classList.add('show');
        
        const projection = map.getProjection();
        const pixelPosition = projection.fromLatLngToContainerPixel(position);
        
        tooltip.style.left = (pixelPosition.x + 10) + 'px';
        tooltip.style.top = (pixelPosition.y - 40) + 'px';
        
        setTimeout(() => {
            tooltip.classList.remove('show');
        }, 3000);
    }

    // Настройка подсказок для элементов управления
    function setupTooltips() {
        const buttons = document.querySelectorAll('.control-btn');
        buttons.forEach(button => {
            button.addEventListener('mouseenter', function(e) {
                const rect = this.getBoundingClientRect();
                const tooltip = document.getElementById('tooltip');
                
                let text = '';
                if (this.textContent.includes('3D')) {
                    text = 'Включает/выключает 3D режим карты';
                } else if (this.textContent.includes('Сбросить')) {
                    text = 'Возвращает карту к исходному виду';
                } else if (this.textContent.includes('зданий')) {
                    text = 'Режим выделения зданий прямоугольником';
                } else if (this.textContent.includes('территории')) {
                    text = 'Режим измерения расстояния линейкой';
                } else if (this.textContent.includes('Сгенерировать')) {
                    text = 'Создает случайные здания на карте';
                } else if (this.textContent.includes('Назад')) {
                    text = 'Вернуться на главную страницу';
                }
                
                tooltip.textContent = text;
                tooltip.style.left = (rect.left + window.scrollX) + 'px';
                tooltip.style.top = (rect.top + window.scrollY - 40) + 'px';
                tooltip.classList.add('show');
            });
            
            button.addEventListener('mouseleave', function() {
                document.getElementById('tooltip').classList.remove('show');
            });
        });
    }

    // Функции для кнопок
    function switchTo3D() {
        map.setTilt(45);
        showTooltip('3D режим активирован! Используйте Ctrl + левая кнопка мыши для вращения карты.', map.getCenter());
    }

    function resetView() {
        map.setCenter({ lat: 55.751244, lng: 37.618423 });
        map.setZoom(11);
        map.setTilt(0);
        setTimeout(() => {
            map.setTilt(45);
        }, 100);
        showTooltip('Вид карты сброшен', map.getCenter());
    }

    function toggleBuildingSelection() {
        toggleBuildingSelectionMode();
    }

    function toggleAreaSelection() {
        toggleAreaSelectionMode();
    }

    function addDemoBuildings() {
        const demoBuildings = [
            { position: { lat: 55.7558, lng: 37.6173 }, type: 'commercial', height: 12, color: '#ff6b35' },
            { position: { lat: 55.7520, lng: 37.6175 }, type: 'residential', height: 8, color: '#1e82ff' },
            { position: { lat: 55.7500, lng: 37.6170 }, type: 'industrial', height: 5, color: '#00c6ff' },
            { position: { lat: 55.7495, lng: 37.6238 }, type: 'skyscraper', height: 30, color: '#0047ab' },
        ];
