<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Демо-режим - Map Тим</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://api-maps.yandex.ru/2.1/?apikey=c23c1d6b-4aaf-4dd6-a267-749684d7f7cc&lang=ru_RU"></script>
    <style>
        .demo-container {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .map-container {
            height: 600px;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .demo-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 10px 20px;
            background: #1e82ff;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.25s;
        }
        
        .control-btn:hover {
            background: #006dff;
        }
        
        .back-btn {
            background: #555;
        }
        
        .back-btn:hover {
            background: #666;
        }
    </style>
</head>
<body>
    
<header class="header">
    <a href="index.html" class="logo-link">
        <img src="C:\vscode\startup\map tim logo.png" alt="Map Тим" class="logo-image">
    </a>
    <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="#contact">Контакты</a>
    </nav>
</header>

<section class="demo-container">
    <h1 class="section-title">Демо-режим: Интерактивная 3D Карта</h1>
    <p>Используйте элементы управления для навигации по 3D карте</p>
    
    <div class="demo-controls">
        <button class="control-btn" onclick="switchTo3D()">Включить 3D</button>
        <button class="control-btn" onclick="resetView()">Сбросить вид</button>
        <button class="control-btn" onclick="addBuilding()">Добавить здание</button>
        <button class="control-btn back-btn" onclick="window.location.href='index.html'">← Назад</button>
    </div>
    
    <div id="map" class="map-container"></div>
</section>

<footer class="footer" id="contact">
    <p>Email: info@maptim.example</p>
    <p>© 2025 MAP TIM</p>
</footer>

<script>
    let map;
    let buildingCollection;

    // Инициализация карты
    ymaps.ready(init);
    
    function init() {
        map = new ymaps.Map('map', {
            center: [55.751244, 37.618423], // Москва
            zoom: 11,
            controls: ['zoomControl', 'fullscreenControl']
        }, {
            searchControlProvider: 'yandex#search'
        });

        // Включаем режим 3D
        map.options.set('map3d', true);
        
        // Создаем коллекцию для зданий
        buildingCollection = new ymaps.GeoObjectCollection();
        map.geoObjects.add(buildingCollection);
        
        // Добавляем несколько демо-зданий
        addDemoBuildings();
    }
    
    function switchTo3D() {
        if (map) {
            map.options.set('map3d', true);
            alert('3D режим активирован! Используйте Ctrl + левая кнопка мыши для вращения карты.');
        }
    }
    
    function resetView() {
        if (map) {
            map.setCenter([55.751244, 37.618423], 11);
            map.options.set('map3d', false);
            setTimeout(() => {
                map.options.set('map3d', true);
            }, 100);
        }
    }
    
    function addBuilding() {
        if (map && buildingCollection) {
            const center = map.getCenter();
            const building = new ymaps.Placemark(
                [center[0] + (Math.random() - 0.5) * 0.01, center[1] + (Math.random() - 0.5) * 0.01],
                {
                    hintContent: 'Сгенерированное здание',
                    balloonContent: 'Демонстрационное здание'
                },
                {
                    preset: 'islands#blueBuildingIcon'
                }
            );
            buildingCollection.add(building);
        }
    }
    
    function addDemoBuildings() {
        const demoBuildings = [
            [55.7558, 37.6173],
            [55.7520, 37.6175],
            [55.7500, 37.6170],
            [55.7495, 37.6238],
        ];
        
        demoBuildings.forEach(coords => {
            const building = new ymaps.Placemark(coords, {
                hintContent: 'Демо-здание',
                balloonContent: 'Пример сгенерированного здания'
            }, {
                preset: 'islands#blueBuildingIcon'
            });
            buildingCollection.add(building);
        });
    }
</script>
</body>
</html>
